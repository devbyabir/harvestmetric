[project]
name = "harvestmetric"
version = "0.1.0"
description = "Crop-yield analytics with leakage-safe evaluation and an interactive Streamlit demo"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }

[tool.setuptools]
packages = ["harvestmetric"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
