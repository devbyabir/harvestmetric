name: tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies (clean environment)
        run: pip install -r requirements-dev.txt
      - name: Audit dependencies for known vulnerabilities
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt -r requirements-dev.txt --progress-spinner off
      - name: Build the package and check every subpackage is included
        run: |
          pip wheel . --no-deps -w dist -q
          python -c "import glob, zipfile; n = zipfile.ZipFile(glob.glob('dist/*.whl')[0]).namelist(); assert all(f'harvestmetric/{p}/__init__.py' in n for p in ('synthetic', 'real')), n; print(len(n), 'files')"
      - name: Lint (ruff)
        run: python -m ruff check .
      - name: Type check (mypy)
        run: python -m mypy
      - name: Tests, including the app on every page with committed data, a small fixture and no data
        run: python -m pytest -rs
      - name: Rebuild Part B metrics from the committed panel and compare
        run: |
          cp reports/real/metrics.json /tmp/committed_metrics.json
          python -m harvestmetric.real.train
          python - <<'PY'
          import json
          A = json.load(open("/tmp/committed_metrics.json"))
          B = json.load(open("reports/real/metrics.json"))
          a, b = A["results"], B["results"]
          for name in a:
              for split in ("cv", "test"):
                  for k in ("rmse", "mae"):
                      assert abs(a[name][split][k] - b[name][split][k]) < 0.05, (name, split, k)
          for k in ("rmse", "mae"):  # geographic check, tuned inside each district fold
              assert abs(A["geographic_check"]["model"][k] - B["geographic_check"]["model"][k]) < 0.05, ("geo", k)
          assert A["geographic_check"]["districts_where_model_beats_trend"] == \
              B["geographic_check"]["districts_where_model_beats_trend"]
          for lvl in ("80%", "90%"):  # empirical CV-residual intervals
              for k in ("half_width_bu_ac", "test_coverage"):
                  assert abs(A["intervals"][lvl][k] - B["intervals"][lvl][k]) < 0.05, ("intervals", lvl, k)
          assert A["selection"]["prediction_supported"] == B["selection"]["prediction_supported"]
          print("Part B metrics reproduced from committed panel")
          PY
